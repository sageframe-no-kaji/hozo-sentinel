# ─────────────────────────────────────────────────────────────────────────────
# Hōzō — deploy to: /opt/services/hozo/
#
# Production setup:
#   sudo mkdir -p /opt/services/hozo/{configs,logs,ssh}
#   sudo cp configs/config.example.yaml /opt/services/hozo/configs/config.yaml
#   sudo chmod 600 /opt/services/hozo/configs/config.yaml
#   cp .env.example /opt/services/hozo/.env   # set HOZO_SESSION_SECRET
#   sudo chmod 600 /opt/services/hozo/.env
#   sudo cp ~/.ssh/id_ed25519 /opt/services/hozo/ssh/id_ed25519
#   sudo cp ~/.ssh/id_ed25519.pub /opt/services/hozo/ssh/id_ed25519.pub
#   touch /opt/services/hozo/ssh/known_hosts
#   sudo chmod 600 /opt/services/hozo/ssh/id_ed25519
#   docker compose up -d
#
# The config.yaml file MUST exist before `up`: Docker creates an empty
# directory in its place otherwise and the container then fails to start.
# ─────────────────────────────────────────────────────────────────────────────

services:
  hozo:
    build:
      context: /opt/services/hozo
      dockerfile: /opt/services/hozo/Dockerfile
    image: hozo:latest
    container_name: hozo
    restart: unless-stopped

    # WOL requires NET_ADMIN + host networking so the magic packet reaches the
    # LAN broadcast address.  For Tailscale-only setups this also avoids NAT.
    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    # Session secret lives here, not in config.yaml — .env is gitignored, and
    # a secret in a .yaml travels with the config into the sageframe-config repo.
    env_file:
      - .env

    environment:
      HOZO_CONFIG: /etc/hozo/config.yaml
      HOZO_SESSION_SECRET: ${HOZO_SESSION_SECRET:-}
      TZ: America/New_York
      # Uncomment to inject a Tailscale auth key at startup:
      # TAILSCALE_AUTHKEY: tskey-auth-xxxxx

    volumes:
      # ── Config file (read-write) ────────────────────────────────────────────
      # Mounted as a single file (not its parent directory) so the container
      # can only ever touch config.yaml — even if the web app were compromised,
      # it cannot read or write sibling files like operator backups or .env.
      # The writer falls back to an in-place write under a single-file mount.
      # The host file MUST exist before `docker compose up` (see setup steps).
      - /opt/services/hozo/configs/config.yaml:/etc/hozo/config.yaml

      # ── Logs (persistent, writable) ─────────────────────────────────────────
      - /opt/services/hozo/logs:/var/log/hozo

      # ── SSH identity for backup-box access (read-only directory) ────────────
      # Mount the directory, not individual files: a missing id_ed25519.pub or
      # known_hosts would otherwise be created by Docker as an empty directory.
      - /opt/services/hozo/ssh:/root/.ssh:ro

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
